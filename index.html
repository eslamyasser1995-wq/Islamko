<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>إسلامكو</title>
<meta name="theme-color" content="#0B2545" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="إسلامكو" />
<style>
:root{--navy:#0B2545;--turq:#13C4C4;--bg:#F4F8FB}
*{box-sizing:border-box;margin:0;font-family:-apple-system,'SF Arabic',sans-serif}
body{background:var(--bg);color:var(--navy);padding-bottom:90px}
.header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.header h1{font-size:20px;color:var(--turq)}
.ghost{background:transparent;color:#fff;border:1px solid var(--turq);border-radius:10px;padding:6px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0b254514}
.emoji{font-size:56px;text-align:center;padding:16px;background:#E6F9F9}
.info{padding:10px}
.price{color:#0a9a9a;font-weight:700;margin:4px 0}
.primary{background:var(--turq);color:#fff;border:0;border-radius:12px;padding:10px;font-weight:700;width:100%;font-size:15px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0 20px;border-top:1px solid #dde6ee}
.tabbar a{color:var(--navy);font-size:15px;padding:6px 18px;border-radius:10px}
.tabbar a.on{background:var(--turq);color:#fff}
.page{padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e3ebf2}
input{width:100%;padding:12px;border:1px solid #cfdbe6;border-radius:10px;margin:6px 0 12px;font-size:16px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--turq);background:#fff;font-size:18px}
.badge{background:#e53935;color:#fff;border-radius:10px;padding:0 6px;font-size:12px}
</style>
</head>
<body>
<div class="header"><h1>🐟 <span id="title"></span></h1><button class="ghost" id="langBtn"></button></div>
<div id="app"></div>
<nav class="tabbar">
  <a id="tHome" onclick="go('home')"></a>
  <a id="tCart" onclick="go('cart')"></a>
</nav>

<script>
const WHATSAPP = '96500000000'; // غيّر الرقم لرقمك بصيغة دولية بدون +

const products = [
  {id:1, ar:'هامور طازج', en:'Fresh Hamour', price:4.5, emoji:'🐟'},
  {id:2, ar:'زبيدي', en:'Zobaidi', price:6.0, emoji:'🐠'},
  {id:3, ar:'سبيطي', en:'Sobaity', price:5.25, emoji:'🐟'},
  {id:4, ar:'روبيان كويتي', en:'Kuwaiti Shrimp', price:7.0, emoji:'🦐'},
  {id:5, ar:'ديري', en:'Dairy Fish', price:3.75, emoji:'🐡'},
  {id:6, ar:'صافي', en:'Safi', price:4.0, emoji:'🐟'},
  {id:7, ar:'جمبري', en:'Prawns', price:8.5, emoji:'🦐'},
  {id:8, ar:'حبار', en:'Squid', price:3.0, emoji:'🦑'}
];

const T = {
  ar:{app:'إسلامكو', home:'الرئيسية', cart:'السلة', add:'أضف للسلة', kd:'د.ك', kg:'كجم', total:'الإجمالي', empty:'السلة فاضية', addr:'العنوان', phone:'رقم الهاتف', send:'إرسال الطلب على واتساب', lang:'English', need:'اكتب العنوان والهاتف', order:'طلب جديد'},
  en:{app:'ISLAMKO', home:'Home', cart:'Cart', add:'Add to cart', kd:'KD', kg:'kg', total:'Total', empty:'Your cart is empty', addr:'Address', phone:'Phone', send:'Send order via WhatsApp', lang:'العربية', need:'Enter address and phone', order:'New order'}
};

let lang = localStorage.getItem('lang') || 'ar';
let page = 'home';
let cart = JSON.parse(localStorage.getItem('cart') || '[]');

const t = (k) => T[lang][k];
const save = () => localStorage.setItem('cart', JSON.stringify(cart));
const count = () => cart.reduce((s,i)=>s+i.qty,0);
const total = () => cart.reduce((s,i)=>s+i.price*i.qty,0);

function add(id){
  const f = cart.find(i=>i.id===id);
  if(f) f.qty++; else cart.push({...products.find(p=>p.id===id), qty:1});
  save(); render();
}
function change(id, d){
  const f = cart.find(i=>i.id===id);
  f.qty += d;
  if(f.qty<=0) cart = cart.filter(i=>i.id!==id);
  save(); render();
}
function go(p){ page = p; render(); window.scrollTo(0,0); }

function send(){
  const a = document.getElementById('addr').value.trim();
  const p = document.getElementById('phone').value.trim();
  if(!a || !p) return alert(t('need'));
  const lines = cart.map(i=>`- ${lang==='ar'?i.ar:i.en} × ${i.qty} = ${(i.price*i.qty).toFixed(3)} ${t('kd')}`).join('\n');
  const msg = `${t('order')}\n${lines}\n${t('total')}: ${total().toFixed(3)} ${t('kd')}\n${t('addr')}: ${a}\n${t('phone')}: ${p}`;
  window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg), '_blank');
  cart = []; save(); render();
}

function render(){
  document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = t('app');
  document.getElementById('langBtn').textContent = t('lang');
  document.getElementById('langBtn').onclick = () => { lang = lang==='ar'?'en':'ar'; localStorage.setItem('lang', lang); render(); };
  const n = count();
  document.getElementById('tHome').textContent = t('home');
  document.getElementById('tCart').innerHTML = t('cart') + (n ? ` <span class="badge">${n}</span>` : '');
  document.getElementById('tHome').className = page==='home' ? 'on' : '';
  document.getElementById('tCart').className = page==='cart' ? 'on' : '';

  const app = document.getElementById('app');
  if(page==='home'){
    app.innerHTML = '<div class="grid">' + products.map(p => `
      <div class="card">
        <div class="emoji">${p.emoji}</div>
        <div class="info">
          <div>${lang==='ar'?p.ar:p.en}</div>
          <div class="price">${p.price.toFixed(3)} ${t('kd')} / ${t('kg')}</div>
          <button class="primary" onclick="add(${p.id})">${t('add')}</button>
        </div>
      </div>`).join('') + '</div>';
  } else {
    if(!cart.length){ app.innerHTML = `<div class="page">${t('empty')}</div>`; return; }
    app.innerHTML = '<div class="page">' + cart.map(i => `
      <div class="row">
        <span>${lang==='ar'?i.ar:i.en}</span>
        <span class="qty"><button onclick="change(${i.id},-1)">−</button> ${i.qty} <button onclick="change(${i.id},1)">+</button></span>
        <span>${(i.price*i.qty).toFixed(3)} ${t('kd')}</span>
      </div>`).join('') + `
      <div class="row"><b>${t('total')}</b><b>${total().toFixed(3)} ${t('kd')}</b></div>
      <input id="addr" placeholder="${t('addr')}" />
      <input id="phone" placeholder="${t('phone')}" inputmode="tel" />
      <button class="primary" onclick="send()">${t('send')}</button>
    </div>`;
  }
}
render();
</script>
</body>
</html>
