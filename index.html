<style>
:root{--navy:#0B2545;--turq:#13C4C4;--bg:#F4F8FB}
*{box-sizing:border-box;margin:0;font-family:-apple-system,'SF Arabic',sans-serif}
body{background:var(--bg);color:var(--navy);padding-bottom:90px}
.header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.header h1{font-size:20px;color:var(--turq)}
.ghost{background:transparent;color:#fff;border:1px solid var(--turq);border-radius:10px;padding:6px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0b254514}
.emoji{font-size:56px;text-align:center;padding:16px;background:#E6F9F9}
.info{padding:10px}
.price{color:#0a9a9a;font-weight:700;margin:4px 0}
.primary{background:var(--turq);color:#fff;border:0;border-radius:12px;padding:10px;font-weight:700;width:100%;font-size:15px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0 20px;border-top:1px solid #dde6ee}
.tabbar a{color:var(--navy);font-size:15px;padding:6px 18px;border-radius:10px}
.tabbar a.on{background:var(--turq);color:#fff}
.page{padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e3ebf2}
input{width:100%;padding:12px;border:1px solid #cfdbe6;border-radius:10px;margin:6px 0 12px;font-size:16px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--turq);background:#fff;font-size:18px}
.badge{background:#e53935;color:#fff;border-radius:10px;padding:0 6px;font-size:12px}
</style>
</head>
